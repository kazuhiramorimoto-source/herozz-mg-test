<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO'ZZ MG定例 小テスト 第2回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Yomogi&family=Shippori+Mincho:wght@600;800&family=Roboto+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
@media print{ body{background:#fff;padding:0} .bar-top,.noprint{display:none!important} .sheet{box-shadow:none;border:1px solid #000;margin:0 0 10px} .q{break-inside:avoid} .result{break-inside:avoid} }
.linkbox{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--fill);border:1px solid var(--rule-soft);padding:8px 10px;margin-top:8px}
.pill.kw{background:var(--warn-soft);color:var(--warn)}
.stem .blank{display:inline-block;white-space:nowrap;min-width:3.4em;text-align:center;border:1.5px solid var(--ink);padding:0 .4em;margin:0 .2em;line-height:1.5;font-weight:700}
.stem{line-height:2}
#homeBtn{margin-left:12px;padding:3px 10px;font-size:12px}
textarea{background-origin:content-box;background-clip:content-box;background-attachment:local}  /* 罫線を文字の下にそろえる（文字に線が重ならない） */
.rank-me{font-size:20px;font-weight:700;margin:4px 0 12px}
.rank-me b{font-family:var(--pen);color:var(--red);font-size:34px;margin:0 4px}
table.rank{width:100%;border-collapse:collapse;font-size:15px}
table.rank th,table.rank td{border-bottom:1px solid var(--rule-soft);padding:7px 10px;text-align:left}
table.rank th{border-bottom:1.5px solid var(--ink);font-family:var(--serif)}
table.rank td.n,table.rank th.n{text-align:right;width:5em;font-family:var(--mono)}
table.rank tr.me td{background:var(--red-soft);font-weight:700}
.rank-upd{font-size:12px;color:var(--muted);margin-top:8px;text-align:right}
.nw{display:inline-block;white-space:nowrap}
.cover .theme{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.15em;margin:8px 0 2px}
.formbox{max-width:640px;margin:20px auto 0;border:1.5px solid var(--ink);text-align:left}
.frow{display:grid;grid-template-columns:7em minmax(0,1fr)}
.frow+.frow{border-top:1px solid var(--ink)}
.frow label{display:flex;align-items:center;justify-content:center;padding:10px 8px;font-weight:700;font-family:var(--serif);background:var(--fill);border-right:1.5px solid var(--ink);white-space:nowrap;letter-spacing:.2em}
.frow input{width:100%;min-width:0;border:0;border-radius:0;font-size:17px;padding:10px 14px;background:var(--paper);font-family:var(--sans)}
.frow input#em,.frow input#pw{font-family:var(--mono);font-size:16px}
.cover table.spec{width:100%;max-width:640px}
.cover table.spec td:first-child{width:7em}
.sentok{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--ok);margin:10px 0 0}
.passline{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--ink);font-weight:700;display:inline-block}
.passline.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.passline.ng{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.pwbox{display:grid;grid-template-columns:auto 1fr;border:1.5px solid var(--ink);margin:10px auto 0;max-width:640px;text-align:left}
.pwbox label{padding:10px 16px;font-weight:700;border-right:1.5px solid var(--ink);background:var(--fill);white-space:nowrap;letter-spacing:.2em}
.pwbox input{border:0;border-radius:0;font-size:18px;padding:10px 14px;background:var(--paper);font-family:var(--mono)}
</style>
</head><body>
<div class="wrap">
  <div class="bar-top">
    <div class="strip">
      <div class="meta"><span><b id="kai"></b></span><span>試験時間 <b id="lim">12</b>分</span><button class="btn ghost sm noprint" id="homeBtn" hidden>ホームに戻る</button></div>
      <div class="timer" id="timer"><small>残り</small>12:00</div>
    </div>
    <div class="progress" id="progWrap" hidden><i id="progBar"></i></div>
  </div>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<script>
/* ============ 設定（config.json）と問題（items.enc.json＝合言葉で復号） ============ */
let CFG = {round:"第2回",limitMin:12,closed:false,showKey:false,form:{postUrl:"",entryName:"",entryData:""}};
let ITEMS = null;
const BUILD = "2026-10-19 第2回 v17";
/* 管理者（config.json の adminNames）が受験した場合はテスト受験＝順位に入れず、スプシの別タブに保存される */
const isAdminName = n => { const v=String(n||"").normalize("NFKC").toLowerCase().replace(/[\s　（）()]/g,""); return !!v && (CFG.adminNames||[]).some(a=>String(a).normalize("NFKC").toLowerCase().replace(/[\s　（）()]/g,"")===v); };
/* 管理者メール（config.json の adminEmails）は何回でも受けられる＝テスト受験（順位に入らない・合格済みチェックもしない） */
const isAdminEmail = e => { const v=String(e||"").normalize("NFKC").trim().toLowerCase(); return !!v && (CFG.adminEmails||[]).some(a=>String(a).trim().toLowerCase()===v); };
const isTestRun = () => !!S.draft.test || isAdminName(S.draft.name) || isAdminEmail(S.draft.email);  /* 表紙に出す版（古いキャッシュを見ているか判別用） */
const SECTIONS = { ichi:{label:"第１問",sub:"一問一答　言葉の定義・穴埋め・選択"}, sel:{label:"第２問",sub:"選択　MGとしてどう返す"}, essay:{label:"第２問",sub:"記述　台本を見る・言葉で説明する・提案する"} };
const AI_TYPES = new Set(["short","essay"]);
const PARAMS = new URLSearchParams(location.search);

/* ============ ユーティリティ ============ */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (v == null || v === false) continue; if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v); }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
};
function hash(s){let x=2166136261;for(const c of s){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}
function order(q){let a=hash(q.id)||1;const idx=q.ans.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){a^=a<<13;a>>>=0;a^=a>>>17;a^=a<<5;a>>>=0;const j=a%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}return idx}
const KANA="1234", CIRC="①②③④";
const rMax = q => q.rubric.reduce((a,b)=>a+b.p,0);
const secMax = s => ITEMS.filter(q=>q.s===s).reduce((a,q)=>a+q.pts,0);
const fmt = ms => { const t=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); };
const len = s => [...(s||"")].length;
const norm = s => String(s||"").normalize("NFKC").toLowerCase().replace(/[\s　「」『』()（）・,，、。.＝=]/g,"");
const hit = (input,variants) => { const v=norm(input).replace(/(倍|再生|回)$/,""); return !!v && variants.some(x=>{const n=norm(x); return /^[0-9]+$/.test(n)||n.length<=1 ? v===n : (v===n || v.includes(n));}); };
function fillRight(q,arr){ arr=arr||[]; if(q.anyOrder){ const used=new Set(); for(const a of arr){ const i=q.blanks.findIndex((b,k)=>!used.has(k)&&hit(a,b)); if(i>=0) used.add(i);} return used.size; } return q.blanks.filter((b,i)=>hit(arr[i],b)).length; }
const fillOk = (q,arr) => fillRight(q,arr)===q.blanks.length;
function kwItems(q,text){ const v=norm(text); return q.rubric.map(x=>x.kw&&v&&x.kw.every(g=>g.some(w=>v.includes(norm(w))))?x.p:0); }
function gradeRec(rec){ // スプレッドシート側（Apps Script）と同じ採点
  const sc={ichi:0,sel:0,essay:0,total:0,pending:false}, scores=rec.essayScores||{};
  for(const q of ITEMS){ let pts=0;
    if(q.type==="mc") pts=(rec.answers||{})[q.id]===0?q.pts:0;
    else if(q.type==="fill") pts=q.pts*fillRight(q,(rec.answers||{})[q.id])/q.blanks.length;
    else { let s=scores[q.id]; if(!s){ const k=kwItems(q,(rec.essays||{})[q.id]||""); s=scores[q.id]={items:k,score:k.reduce((a,b)=>a+b,0),comment:"",by:"kw"}; } if(s.by==="kw") sc.pending=true; pts=s.score/rMax(q)*q.pts; }
    sc[q.s]+=pts; }
  for(const k of ["ichi","sel","essay"]) sc[k]=Math.round(sc[k]*10)/10;
  sc.total=Math.round((sc.ichi+sc.sel+sc.essay)*10)/10; rec.essayScores=scores; rec.sc=sc; rec.status=sc.pending?"仮":"確定"; return rec;
}
const b64u = { enc:s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
               dec:s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0))) };
const fromB64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decryptItems(pw){ return decryptFile("items.enc.json",pw); }
async function decryptFile(name,pw){
  const blob=await (await fetch(name+"?v="+Date.now())).json();
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(blob.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(blob.iv)},key,fromB64(blob.d));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ============ メールと合格済みチェック（passed.json＝合格者のメールのハッシュ。スプシ側が更新する） ============ */
const normEmail = e => String(e||"").normalize("NFKC").trim().toLowerCase();
const emailOk = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(normEmail(e));
const passPts = () => { const t=ITEMS?ITEMS.reduce((a,q)=>a+q.pts,0):(CFG.totalPts||22); return Math.ceil(t*(CFG.passRatio||0.5)*10)/10; };
async function sha256hex(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
async function alreadyPassed(email){ try{ const j=await (await fetch("passed.json?v="+Date.now())).json(); const hx=await sha256hex((j.salt||"")+normEmail(email)); return (j.h||[]).includes(hx); }catch(e){ return false; } }

/* ============ 状態（この端末だけ） ============ */
const DKEY="mgtest-pages-r2";
const S={ draft:{name:"",email:"",startedAt:null,answers:{},essays:{},test:PARAMS.get("test")==="1"}, rec:null, busy:false, err:"", pw:"" };
function loadDraft(){ try{ const d=JSON.parse(localStorage.getItem(DKEY)||"null"); if(d) S.draft={...S.draft,...d}; S.pw=localStorage.getItem(DKEY+"-pw")||sessionStorage.getItem(DKEY+"-pw")||""; }catch(e){} }
function savePw(){ try{ localStorage.setItem(DKEY+"-pw",S.pw); sessionStorage.setItem(DKEY+"-pw",S.pw); }catch(e){} }
let lsT; function saveDraft(){ clearTimeout(lsT); lsT=setTimeout(()=>{try{localStorage.setItem(DKEY,JSON.stringify(S.draft))}catch(e){}},200); }

/* ============ タイマー ============ */
function remaining(){ if(!S.draft.startedAt) return CFG.limitMin*60000; return CFG.limitMin*60000-(Date.now()-Date.parse(S.draft.startedAt)); }
setInterval(()=>{ const el=$("#timer");
  if(S.rec){ el.replaceChildren(h("small",{},"所要"),fmt(Date.parse(S.rec.submittedAt)-Date.parse(S.rec.startedAt))); el.classList.remove("low"); return; }
  const ms=remaining(); el.replaceChildren(h("small",{},"残り"),fmt(ms)); el.classList.toggle("low",!!S.draft.startedAt&&ms<3*60000);
  if(S.draft.startedAt&&ITEMS&&ms<=0&&!S.busy) submit(true);
},500);

/* ============ 描画 ============ */
function render(){
  $("#kai").textContent=CFG.round; $("#lim").textContent=CFG.limitMin;
  /* ホームに戻る：結果・順位の画面からはいつでも。受験中は管理者（テスト受験）だけ＝戻るとタイマーは10分に戻る */
  const hb=$("#homeBtn"); hb.hidden=!(S.rec||S.view==="rank"||(S.draft.startedAt&&ITEMS&&isTestRun())); hb.onclick=goHome;
  const b=$("#banner"); b.replaceChildren(); if(S.err) b.append(h("div",{class:"banner err"},S.err));
  const v=$("#view"); v.replaceChildren(); $("#progWrap").hidden=true;
  if(S.view==="rank"&&ITEMS) return renderRankOnly(v);
  if(S.rec) return renderResult(v,S.rec);
  if(S.draft.startedAt&&ITEMS) return renderTest(v);
  renderCover(v);
}
const cnt=(s,t)=>ITEMS?ITEMS.filter(q=>q.s===s&&(!t||q.type===t)).length:0;
function renderCover(v){
  const resume=!!S.draft.startedAt, ms=Math.max(0,remaining());
  const startedStr=resume?new Date(S.draft.startedAt).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}):"";
  v.append(h("section",{class:"sheet cover"},
    h("div",{class:"kai"},CFG.round),
    h("h1",{},h("span",{class:"nw"},"マネージャー定例"),h("wbr"),h("span",{class:"nw"},"小テスト")),h("div",{class:"theme"},"言語化とプロセスエコノミー"),
    h("div",{class:"booklet"},"問題冊子"),
    h("table",{class:"spec"},h("tbody",{},
      h("tr",{},h("td",{},"試験時間"),h("td",{},`${CFG.limitMin}分（開始で計測）`)),
      h("tr",{},h("td",{},"第１問"),h("td",{},"一問一答・穴埋め・選択　8問×2点＝16点")),
      h("tr",{},h("td",{},"第２問"),h("td",{},"記述　3問＝14点（4点・4点・最終問題6点）")),
      h("tr",{},h("td",{},"満点"),h("td",{},"30点（記述は提出時に仮の点・採点後に確定）")),
      h("tr",{},h("td",{},"結果"),h("td",{},"提出後に自分の点数と採点が出る（順位は管理者が確認）")),
      h("tr",{},h("td",{},"追試"),h("td",{},`${passPts()}点以上で合格（合格したメールでは追試不可）`)),
      isTestRun()?h("tr",{},h("td",{},"受験の扱い"),h("td",{},"テスト受験（管理者・順位に入らない）")):null)),
    h("div",{class:"notice"},h("div",{class:"notice-h"},"注意事項"),h("ol",{class:"rules"},
      h("li",{},"講義資料・AIは見ずに解答すること。"),
      h("li",{},"選択問題は、①〜④のうち正しいものを一つ選んで塗ること。"),
      h("li",{},"穴埋めは空欄ごとに採点する。言葉が少し違っても、意味が合っていれば正解とする。"),
      h("li",{},"記述は字数内で書くこと。指定の言葉がある問題は、その言葉をすべて使うこと。"),
      h("li",{},`「解答を始める」を押すと${CFG.limitMin}分の計測が始まる。途中で閉じても計測は止まらない。`),
      h("li",{},`${CFG.limitMin}分たつと解答はストップし、その時点の解答で自動的に提出される。提出後の訂正はできない。`))),
    CFG.closed?h("div",{class:"banner err",style:"max-width:640px;margin:20px auto 0"},"このテストの受付は終了しました。"):null,
    resume?h("div",{class:"banner warn",style:"text-align:left;max-width:640px;margin:20px auto 0"},
      ms>0?`${S.draft.name||"あなた"}さんの受験中の答案があります（${startedStr} 開始・残り ${fmt(ms)}）。時間は止まっていません。合言葉を入れて「続きから再開する」を押してください。解答は保存されています。`
          :`試験時間が終了しています。合言葉を入れて押すと、保存されている解答でそのまま提出されます。`):null,
    h("div",{class:"formbox"},
      h("div",{class:"frow"},h("label",{for:"nm"},"氏名"),
        h("input",{type:"text",id:"nm",value:S.draft.name,autocomplete:"name",placeholder:"MG名（例：まめりん）",oninput:e=>{S.draft.name=e.target.value;saveDraft();$("#go").disabled=!canStart();$("#adminNote").hidden=!isTestRun();}})),
      h("div",{class:"frow"},h("label",{for:"em"},"メール"),
        h("input",{type:"email",id:"em",value:S.draft.email||"",autocomplete:"email",inputmode:"email",autocapitalize:"off",placeholder:"例：xxxx@gmail.com",disabled:!!S.draft.startedAt,oninput:e=>{S.draft.email=e.target.value.trim();saveDraft();$("#go").disabled=!canStart();$("#adminNote").hidden=!isTestRun();}})),
      h("div",{class:"frow"},h("label",{for:"pw"},"合言葉"),
        h("input",{type:"text",id:"pw",value:S.pw,autocomplete:"off",autocapitalize:"off",placeholder:"当日お伝えします",oninput:e=>{S.pw=e.target.value.trim();$("#go").disabled=!canStart()}}))),
    h("p",{class:"note",id:"adminNote",hidden:!isTestRun(),style:"max-width:640px;margin:6px auto 0;text-align:left"},"管理者として登録されています。テスト受験（何回でも受けられる・順位に入らない）になります。"),
    h("div",{class:"center",style:"margin-top:20px"},
      h("button",{class:"btn ghost",id:"seeRank",style:"margin-right:10px",onclick:openRank},"順位を見る"),
      h("button",{class:"btn red",id:"go",disabled:!canStart(),onclick:start},S.busy?"問題を開いています…":resume?(ms>0?"続きから再開する":"保存した解答で提出する"):`解答を始める（${CFG.limitMin}分）`)),
    h("div",{class:"note",style:"text-align:right;margin-top:14px;font-size:11px"},"版 "+BUILD)
  ));
}
const canStart=()=>S.draft.name.trim()&&(S.pendingRec||!!S.draft.startedAt||emailOk(S.draft.email))&&S.pw&&!S.busy&&(!CFG.closed||!!S.draft.startedAt||!!S.pendingRec);
async function start(){
  S.busy=true; S.err=""; render();
  try{ ITEMS=await decryptItems(S.pw); }catch(e){ S.busy=false; S.err="合言葉が違います。"; render(); return; }
  savePw();
  if(!S.draft.startedAt){
    if(!isTestRun() && await alreadyPassed(S.draft.email)){ S.busy=false; S.err=`このメールアドレスは、すでに${passPts()}点以上で合格しています。追試は受けられません。`; render(); return; }
    S.draft.startedAt=new Date().toISOString(); saveDraft(); }
  S.busy=false; render(); scrollTo(0,0);
}
function isAnswered(q){ if(q.type==="mc") return S.draft.answers[q.id]!=null; if(q.type==="fill") return (S.draft.answers[q.id]||[]).filter(x=>x&&x.trim()).length===q.blanks.length; if(q.parts){ const a=(S.draft.essayParts||{})[q.id]||[]; return q.parts.every((pt,i)=>len(a[i])>=4); } return len(S.draft.essays[q.id])>=(q.type==="short"?4:10); }
function updateProgress(){ const total=ITEMS.length,n=ITEMS.filter(isAnswered).length; $("#progWrap").hidden=false; $("#progBar").style.width=(n/total*100)+"%"; const st=$("#subNote"); if(st) st.textContent=n<total?`未回答が ${total-n} 問あります（未回答は0点）。`:"すべて回答しました。"; }
function stemNodes(s){ const out=[]; let last=0; const re=/（[\s　]*([①②③④]?)[\s　]*）/g; let m; while((m=re.exec(s))){ out.push(s.slice(last,m.index)); out.push(h("span",{class:"blank"},m[1]||"\u00a0")); last=m.index+m[0].length; } out.push(s.slice(last)); return out; }
function head(q,no,extra){ return h("div",{class:"qhead"},h("span",{class:"qno"},`問${no}`),h("div",{class:"stem"},stemNodes(q.stem),q.src?h("span",{class:"tag"},q.src):null,q.type==="fill"?h("span",{class:"tag"},"穴埋め"):q.type==="short"?h("span",{class:"tag"},"一問一答"):null,AI_TYPES.has(q.type)?h("span",{class:"tag"},`${q.pts}点`):null),extra||null); }
function mcBlock(q,no,mode,rec){
  const ord=order(q), chosen=mode==="result"?(rec.answers||{})[q.id]:S.draft.answers[q.id], reveal=mode==="result"&&CFG.showKey;
  const box=h("div",{class:"q"},head(q,no,mode==="result"?h("span",{class:"redpen"},chosen===0?"○":"×"):null),q.quote?h("div",{class:"quote"},q.quote):null);
  const opts=h("div",{class:"opts",role:"radiogroup","aria-label":`問${no}`});
  ord.forEach((ai,k)=>{ const id=`${q.id}_${ai}`; let cls="opt"; if(reveal){ if(ai===0) cls+=" right"; else if(ai===chosen) cls+=" wrong"; } else if(mode==="result"&&ai===chosen) cls+=" "+(ai===0?"right":"wrong");
    opts.append(h("label",{class:cls,for:id},h("input",{type:"radio",name:q.id,id,checked:chosen===ai,disabled:mode==="result",onchange:()=>{S.draft.answers[q.id]=ai;saveDraft();updateProgress()}}),h("span",{class:"k"},KANA[k]),h("span",{class:"t"},q.ans[ai]))); });
  box.append(opts); if(reveal&&q.exp) box.append(h("div",{class:"exp"},q.exp)); return box;
}
function fillBlock(q,no,mode,rec){
  const reveal=mode==="result"&&CFG.showKey, arr=mode==="result"?((rec.answers||{})[q.id]||[]):(S.draft.answers[q.id]||[]);

function paper(v,mode,rec){ let no=0; for(const s of ["ichi","sel","essay"]){ if(!ITEMS.some(q=>q.s===s)) continue; const sec=h("section",{class:"sheet"},h("h2",{class:"part"},h("span",{class:"bigq"},SECTIONS[s].label),h("span",{class:"pts"},`（配点　${secMax(s)}）`)),h("p",{class:"sub"},SECTIONS[s].sub)); for(const q of ITEMS.filter(q=>q.s===s)){ no++; sec.append(q.type==="mc"?mcBlock(q,no,mode,rec):q.type==="fill"?fillBlock(q,no,mode,rec):aiBlock(q,no,mode,rec)); } v.append(sec); } }

/* ============ 提出：採点 → Googleフォームへ送信（ログイン不要）→ 結果表示 ============ */
async function sendToForm(rec){
  if(!CFG.form.postUrl) throw new Error("送信先が未設定");
  const fd=new FormData(); fd.append(CFG.form.entryName,rec.name); fd.append(CFG.form.entryData,JSON.stringify({round:"r2",id:rec.id,name:rec.name,email:rec.email,startedAt:rec.startedAt,submittedAt:rec.submittedAt,answers:rec.answers,essays:rec.essays,auto:rec.auto,test:rec.test}));
  await fetch(CFG.form.postUrl,{method:"POST",mode:"no-cors",body:fd});
}
async function submit(auto){
  if(S.busy||!S.draft.startedAt||!ITEMS) return;
  S.busy=true; render();
  const rec={id:Math.random().toString(36).slice(2,12),name:S.draft.name.trim(),email:normEmail(S.draft.email),startedAt:S.draft.startedAt,submittedAt:new Date(Math.min(Date.now(),Date.parse(S.draft.startedAt)+CFG.limitMin*60000)).toISOString(),answers:S.draft.answers,essays:{},essayScores:{},auto:!!auto,test:isTestRun()};
  for(const q of ITEMS) if(AI_TYPES.has(q.type)) rec.essays[q.id]=[...(S.draft.essays[q.id]||"")].slice(0,q.max).join("");
  gradeRec(rec);
  let sent=true; try{ await sendToForm(rec); }catch(e){ sent=false; }
  rec.sent=sent;
  S.rec=rec; try{ if(rec.test) localStorage.removeItem(DKEY+"-rec"); else localStorage.setItem(DKEY+"-rec",JSON.stringify(rec)); localStorage.removeItem(DKEY); }catch(e){}
  S.draft={name:rec.name,email:S.draft.email,startedAt:null,answers:{},essays:{},test:S.draft.test};
  await loadRank();
  S.busy=false; S.err=sent?"":"回答の送信に失敗しました（電波を確認して「もう一度送る」を押してください）。点数はこの画面で見られます。"; render(); scrollTo(0,0);
  if(location.search) history.replaceState(null,"",location.pathname);
}
function bar(l,v,max,c){return h("div",{class:"bar"},h("span",{},l),h("div",{class:"t"},h("i",{style:`width:${max?v/max*100:0}%;background:${c}`})),h("span",{class:"v"},`${v}/${max}`))}

  const sc=rec.sc;
  v.append(h("section",{class:"sheet"},
    h("div",{class:"result"},
      h("div",{class:"stamp"},rec.status==="仮"?h("div",{class:"center"},h("b",{style:"font-size:30px;line-height:1.2"},"採点中"),h("span",{},`／ ${ITEMS.reduce((a,q)=>a+q.pts,0)}点`)):h("div",{class:"center"},h("b",{},String(sc.total)),h("span",{},`点 / ${ITEMS.reduce((a,q)=>a+q.pts,0)}`))),
      h("div",{},
        h("p",{style:"margin:0;font-weight:700"},`${rec.name} さん　${rec.auto?"自動提出（時間切れ・受付終了）":"提出済み"}　${new Date(rec.submittedAt).toLocaleString("ja-JP")}`),

        h("div",{class:"bars"},bar("一問一答",sc.ichi,secMax("ichi"),"var(--blue)"),secMax("sel")?bar("選択",sc.sel,secMax("sel"),"var(--ok)"):null,secMax("essay")&&rec.status!=="仮"?bar("記述",sc.essay,secMax("essay"),"var(--red)"):null),
        
        rec.test||rec.status==="仮"?null:h("div",{class:"passline "+(sc.total>=passPts()?"ok":"ng")},sc.total>=passPts()?`合格（${passPts()}点以上）`:`追試の対象です（合格は${passPts()}点以上）`),

        rec.sent!==false?h("p",{class:"sentok"},"✓ 答案は送信されました。この画面は閉じて大丈夫です。"):null,
        h("div",{class:"noprint"},
          rec.sent===false?h("div",{class:"row",style:"margin-top:8px"},h("button",{class:"btn sm",onclick:async ev=>{const b=ev.currentTarget;b.disabled=true;b.textContent="送っています…";try{await sendToForm(rec);rec.sent=true;S.err="";render();}catch(e){b.disabled=false;b.textContent="もう一度送る";}}},"もう一度送る")):null,
          h("div",{class:"row",style:"margin-top:8px"},
            h("button",{class:"btn ghost sm",onclick:()=>window.print()},"印刷／PDFに保存")),
          h("p",{class:"note",style:"margin:14px 0 0"},h(rec.test?"button":"a",rec.test?{class:"btn sm",type:"button",onclick:e=>{e.preventDefault(); if(!confirm("この端末に保存された答案を消して、表紙に戻ります。送信済みの点数は消えません。よろしいですか？")) return; try{ localStorage.removeItem(DKEY+"-rec"); localStorage.removeItem(DKEY); }catch(x){} S.rec=null; S.pendingRec=null; S.err=""; S.draft={name:rec.test?rec.name:"",startedAt:null,answers:{},essays:{},test:PARAMS.get("test")==="1"}; history.replaceState(null,"",location.pathname+(S.draft.test?"?test=1":"")); render(); scrollTo(0,0);}}:{href:"#",style:"color:var(--muted)",onclick:e=>{e.preventDefault(); if(!confirm("この端末に保存された答案を消して、表紙に戻ります。送信済みの点数は消えません。よろしいですか？")) return; try{ localStorage.removeItem(DKEY+"-rec"); localStorage.removeItem(DKEY); }catch(x){} S.rec=null; S.pendingRec=null; S.err=""; S.draft={name:"",startedAt:null,answers:{},essays:{},test:PARAMS.get("test")==="1"}; history.replaceState(null,"",location.pathname+(S.draft.test?"?test=1":"")); render(); scrollTo(0,0);}},rec.test?"もう一度受ける（テスト受験・表紙に戻る）":"この端末で別の人が受験する（保存した答案を消す）")))))));
  v.append(rankSection(rec));
  if(!CFG.showKey) v.append(h("p",{class:"note center noprint"},"下は自分の答案です（○×つき）。正解と解説は、管理者が公開したあとにこのページを開き直すと表示されます。"));
  paper(v,"result",rec);
}

/* ============ 順位（rank.enc.json＝集計シートから1分ごとに自動更新・合言葉で復号） ============ */
async function loadRank(){ if(!S.pw) return; try{ S.rank=await decryptFile("rank.enc.json",S.pw); }catch(e){} applyConfirmed(); }
/* 自分の答案の採点結果（r2/g/<答案ID>.json）を GitHub API から直接読む＝ページ公開を待たずに数秒で届く */
const GH_API="https://api.github.com/repos/kazuhiramorimoto-source/herozz-mg-test/contents/r2/g/";
async function pollMine(){
  const rec=S.rec; if(!rec||rec.status!=="仮"||!S.pw||S.ghStop) return false;
  try{ const r=await fetch(GH_API+rec.id+".json?t="+Date.now(),{headers:{Accept:"application/vnd.github.raw"},cache:"no-store"});
    if(r.status===403||r.status===429){ S.ghStop=true; return false; } if(!r.ok) return false;
    const blob=await r.json(); const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(S.pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:fromB64(blob.s),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const g=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(blob.iv)},key,fromB64(blob.d))));
    S.rank=S.rank||{rows:[]}; S.rank.scores=S.rank.scores||{}; S.rank.scores[rec.id]={e:g.e,st:"確定"};
    return applyConfirmed();
  }catch(e){ return false; }
}
setInterval(async()=>{ if(await pollMine()){ S.confirmedNow=false; const y=scrollY; render(); scrollTo(0,y); loadRank(); } },4000);
/* スプシ側（Macの自動採点）で確定した記述の点と講評を、自分の答案に反映する */
function applyConfirmed(){
  const rec=S.rec, x=rec&&S.rank&&S.rank.scores&&S.rank.scores[rec.id]; if(!x||rec.status!=="仮") return false;
  const es=x.e||{}; if(!ITEMS.filter(q=>AI_TYPES.has(q.type)).every(q=>es[q.id]&&es[q.id].by==="ai")) return false;
  for(const q of ITEMS) if(AI_TYPES.has(q.type)) rec.essayScores[q.id]={items:es[q.id].i||[],score:es[q.id].s||0,comment:es[q.id].c||"",by:"ai"};
  gradeRec(rec); try{ if(!rec.test) localStorage.setItem(DKEY+"-rec",JSON.stringify(rec)); }catch(e){}
  S.confirmedNow=true; return true;
}
const sameName=(a,b)=>norm(a)===norm(b);
function rankTable(meName){
  const rows=(S.rank&&S.rank.rows)||[];
  if(!rows.length) return h("p",{class:"note"},"まだ順位はありません（提出から1〜2分で反映されます）。");
  return h("table",{class:"rank"},h("thead",{},h("tr",{},h("th",{class:"n"},"順位"),h("th",{},"氏名"),h("th",{class:"n"},"点数"))),
    h("tbody",{},rows.map(r=>h("tr",{class:meName&&sameName(r[1],meName)?"me":null},h("td",{class:"n"},r[0]+"位"),h("td",{},r[1]),h("td",{class:"n"},r[2])))));
}
function rankSection(rec){
  const rows=(S.rank&&S.rank.rows)||[], late=CFG.cutoff&&Date.parse(rec.startedAt)>=Date.parse(CFG.cutoff);
  const me=rows.find(r=>sameName(r[1],rec.name));
  const head=rec.test?h("p",{class:"note"},"テスト受験（管理者）は順位に入りません。")
    :late?h("p",{class:"note"},"追試（後日受験）のため、順位には入りません。")
    :me?h("p",{class:"rank-me"},"あなたは",h("b",{},me[0]),`位／${rows.length}人中`)
    :h("p",{class:"note"},"集計中です。1〜2分で順位に反映されます（この画面は自動で更新されます）。");
  return h("section",{class:"sheet",id:"rankSec"},h("h2",{class:"part"},h("span",{class:"bigq"},"順位"),h("span",{class:"pts"},"（本試験）")),
    head,rows.length?rankTable(rec.test||late?null:rec.name):null,S.rank&&S.rank.updated?h("div",{class:"rank-upd"},"更新 "+new Date(S.rank.updated).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})):null);
}
function renderRankOnly(v){
  v.append(h("section",{class:"sheet",id:"rankSec"},h("h2",{class:"part"},h("span",{class:"bigq"},"順位"),h("span",{class:"pts"},`（本試験・${CFG.round}）`)),
    rankTable(null),S.rank&&S.rank.updated?h("div",{class:"rank-upd"},"更新 "+new Date(S.rank.updated).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"（自動で更新されます）"):null,
    h("div",{class:"center noprint",style:"margin-top:16px"},h("button",{class:"btn ghost sm",onclick:()=>{S.view=null;render();scrollTo(0,0);}},"表紙に戻る"))));
}
async function openRank(){
  if(!S.pw){ S.err="順位を見るには、合言葉を入れてください。"; render(); return; }
  try{ if(!ITEMS) ITEMS=await decryptItems(S.pw); }catch(e){ S.err="合言葉が違います。"; render(); return; }
  savePw(); S.err=""; await loadRank(); S.view="rank"; render(); scrollTo(0,0);
}
setInterval(async()=>{ if(!(S.rec||S.view==="rank")||!S.pw) return; const before=JSON.stringify(S.rank); await loadRank();
  if(S.confirmedNow){ S.confirmedNow=false; const y=scrollY; render(); scrollTo(0,y); return; }
  if(JSON.stringify(S.rank)!==before){ const old=$("#rankSec"); if(old) old.replaceWith(S.view==="rank"&&!S.rec?(()=>{const d=document.createElement("div");renderRankOnly(d);return d.firstChild;})():rankSection(S.rec)); } },20000);

function goHome(){
  if(S.draft.startedAt&&!S.rec&&!confirm("ホームに戻ります。解答は消え、タイマーは"+CFG.limitMin+"分に戻ります。よろしいですか？")) return;
  try{ localStorage.removeItem(DKEY); if(!S.rec||S.rec.test) localStorage.removeItem(DKEY+"-rec"); }catch(e){}
  S.draft={name:S.draft.name||(S.rec&&S.rec.name)||"",email:S.draft.email||"",startedAt:null,answers:{},essays:{},test:PARAMS.get("test")==="1"};
  S.rec=null; S.pendingRec=null; S.view=null; S.err=""; history.replaceState(null,"",location.pathname); render(); scrollTo(0,0);
}

/* ============ 起動 ============ */
(async()=>{
  loadDraft();
  try{ CFG={...CFG,...(await (await fetch("config.json?v="+Date.now())).json())}; }catch(e){}
  /* 時間切れなのに何も答えていない下書き（開いただけで放置）は、0点の答案として出さずに捨てる */
  if(S.draft.startedAt && remaining()<=0 && !Object.keys(S.draft.answers||{}).length && !Object.values(S.draft.essays||{}).some(v=>v&&String(v).trim())){
    S.draft={name:S.draft.name,startedAt:null,answers:{},essays:{},test:S.draft.test}; try{ localStorage.removeItem(DKEY); }catch(e){}
  }
  render();
  setInterval(async()=>{ try{ const c=await (await fetch("config.json?v="+Date.now())).json(); const was=CFG.closed; CFG={...CFG,...c};
    if(CFG.closed&&S.draft.startedAt&&ITEMS&&!S.busy&&!S.rec){ S.err="管理者が受付を止めました。ここまでの解答で提出しました。"; submit(true); }
    else if(CFG.closed!==was&&!S.draft.startedAt&&!S.rec) render(); }catch(e){} },30000);
  const r=PARAMS.get("r");
  if(r){ try{ const rec=JSON.parse(b64u.dec(r)); if(!ITEMS){ if(S.pw){ try{ ITEMS=await decryptItems(S.pw); }catch(e){} } }
      if(ITEMS){ S.rec=gradeRec(rec); render(); } else { S.err="答案を表示するには、表紙で合言葉を入れて「解答を始める」を押してください（答案はそのまま表示されます）。"; S.pendingRec=rec; render(); } }catch(e){} }
  else if(S.draft.startedAt && S.pw){ try{ ITEMS=await decryptItems(S.pw); }catch(e){} render(); }
  else if(!S.draft.startedAt){ try{ const rec=JSON.parse(localStorage.getItem(DKEY+"-rec")||"null");
      if(rec&&rec.submittedAt&&rec.test){ try{ localStorage.removeItem(DKEY+"-rec"); }catch(e){} }
      else if(rec&&rec.submittedAt){ if(!ITEMS&&S.pw){ try{ ITEMS=await decryptItems(S.pw); }catch(e){} }
        if(ITEMS){ S.rec=gradeRec(rec); await loadRank(); render(); } else { S.err="この端末で提出済みの答案があります。表紙で合言葉を入れて「解答を始める」を押すと、その答案が表示されます。"; S.pendingRec=rec; render(); } } }catch(e){} }
})();
// 合言葉入力後に答案を表示（?r= で開いたとき）
const _start=start; start=async function(){ if(S.pendingRec){ S.busy=true; render(); try{ ITEMS=await decryptItems(S.pw); savePw(); S.rec=gradeRec(S.pendingRec); S.pendingRec=null; S.err=""; await loadRank(); }catch(e){ S.err="合言葉が違います。"; } S.busy=false; render(); return; } return _start(); };
